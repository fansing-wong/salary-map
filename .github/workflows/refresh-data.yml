name: Refresh public salary data
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
concurrency:
  group: salary-data-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ github.repository != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'openpyxl>=3.1,<4'
      - name: Refresh datasets and write status
        run: python scripts/refresh_data.py
      - name: Commit snapshots and refresh status
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/latest.json data/macro.json data/status.json data/china_nbs_2025.json
          if [ -f data/canada_wages.json ]; then git add data/canada_wages.json; fi
          if [ -f data/bls_metro_2025.json ]; then git add data/bls_metro_2025.json; fi
          git diff --cached --quiet || (git commit -m "Refresh salary data" && git push)
